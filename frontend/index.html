<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaSherpa - A guide for tough climb of Java interviews</title>
    <style>
      :root {
        /* Template color scheme - Purple/Pink/Cyan gradients */
        --purple-400: #a855f7;
        --purple-500: #9333ea;
        --purple-600: #7e22ce;
        --purple-900: #581c87;
        --pink-400: #f472b6;
        --pink-500: #ec4899;
        --pink-600: #db2777;
        --cyan-400: #22d3ee;
        --cyan-500: #06b6d4;
        --cyan-600: #0891b2;
        --cyan-900: #164e63;
        
        /* Background */
        --bg-gradient-1: #1a1a1a;
        --bg-gradient-2: #000000;
        --card-bg: rgba(0, 0, 0, 0.5);
        --text-color: #ffffff;
        --muted-text: rgba(255, 255, 255, 0.7);
        --accent-1: var(--purple-400);
        --accent-2: var(--pink-400);
        --accent-3: var(--cyan-400);
        --border-soft: rgba(255, 255, 255, 0.1);
        --glass-blur: 20px;
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
        --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.6);
        --radius-sm: 0.5rem;
        --radius-md: 0.75rem;
        --radius-lg: 1rem;
        --radius-xl: 1.5rem;
      }
      [data-bs-theme="dark"] {
        --bg-gradient-1: #1a1a1a;
        --bg-gradient-2: #000000;
        --card-bg: rgba(0, 0, 0, 0.5);
        --text-color: #ffffff;
        --muted-text: rgba(255, 255, 255, 0.7);
        --accent-1: var(--purple-400);
        --accent-2: var(--pink-400);
        --accent-3: var(--cyan-400);
        --border-soft: rgba(255, 255, 255, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        color: var(--text-color);
        background: radial-gradient(circle at center, var(--bg-gradient-1), var(--bg-gradient-2));
        background-attachment: fixed;
        transition: background 0.6s ease, color 0.3s ease;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        line-height: 1.6;
        overflow-x: hidden;
      }
      .card, .navbar, .modal-content {
        background: var(--card-bg) !important;
        backdrop-filter: blur(var(--glass-blur)) saturate(180%);
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
        border: 1px solid var(--border-soft) !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: var(--shadow-lg);
      }
      .card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-xl);
      }
      .btn-primary, .bg-primary, .text-primary { 
        color: #fff !important; 
      }
      .btn-primary {
        background: linear-gradient(to right, var(--purple-600), var(--pink-600), var(--cyan-600));
        border: none;
        box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .btn-primary:hover { 
        background: linear-gradient(to right, var(--purple-500), var(--pink-500), var(--cyan-500));
        transform: translateY(-2px) scale(1.05);
        box-shadow: 0 6px 25px rgba(168, 85, 247, 0.5);
      }
      .btn-primary:active {
        transform: translateY(0);
      }
      .form-control, input, textarea, select {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: var(--radius-md);
      }
      .form-control:focus, input:focus, textarea:focus, select:focus {
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1), 0 4px 12px rgba(102, 126, 234, 0.15);
        transform: translateY(-1px);
      }
      .animate-fade-up { 
        animation: fadeUp 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
      }
      @keyframes fadeUp {
        from { 
          opacity: 0; 
          transform: translateY(20px); 
        }
        to { 
          opacity: 1; 
          transform: translateY(0); 
        }
      }
      .animate-pop { 
        animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
      }
      @keyframes pop { 
        from { 
          transform: scale(0.95); 
          opacity: 0.8; 
        } 
        to { 
          transform: scale(1); 
          opacity: 1; 
        } 
      }
      @keyframes shimmer {
        0% { background-position: -1000px 0; }
        100% { background-position: 1000px 0; }
      }
      .shimmer {
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        background-size: 1000px 100%;
        animation: shimmer 2s infinite;
      }
      @keyframes gradient-shift {
        0%, 100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }
      .animate-gradient-shift {
        background-size: 200% 200%;
        animation: gradient-shift 3s ease infinite;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, var(--purple-500), var(--cyan-500));
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(to bottom, var(--purple-400), var(--cyan-400));
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
